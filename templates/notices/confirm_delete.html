{% extends 'base.html' %}

{% block title %}공지사항 삭제 - 알바핀치{% endblock %}

{% block content %}
<div class="top-bar">
    <a href="{% url 'notices:manage' %}" class="back">←</a>
    <h1>공지사항 삭제</h1>
    <span style="width: 30px;"></span>
</div>

<div class="page">
    <div class="card">
        <p>아래 공지사항을 정말 삭제하시겠습니까?</p>

        <div style="background: #f8f8f8; padding: 12px; border-radius: 8px; margin: 16px 0;">
            <p style="margin: 0; font-weight: bold;">{{ notice.title }}</p>
            <p style="margin: 4px 0 0 0; color: #666; font-size: 0.9em;">
                {{ notice.created_at|date:"Y-m-d H:i" }}
            </p>
        </div>

        <p style="color: #D85A30; font-size: 0.9em;">
            ⚠️ 삭제하면 복구할 수 없습니다.
        </p>

        <form method="post" style="margin-top: 20px;">
            {% csrf_token %}
            <div style="display: flex; gap: 8px;">
                <a href="{% url 'notices:manage' %}"
                   class="btn btn-outline"
                   style="flex: 1; text-align: center;">취소</a>
                <button type="submit"
                        class="btn"
                        style="flex: 1; background: #D85A30; color: white;">
                    삭제하기
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
