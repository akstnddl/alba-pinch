<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}알바핀치{% endblock %}</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            padding-bottom: 80px;
        }
        a { text-decoration: none; color: inherit; }
        
        .page { max-width: 480px; margin: 0 auto; padding: 16px 20px; }
        
        /* 상단 헤더 */
        .top-bar {
            background: white;
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eee;
            position: sticky;
            top: 0;
            z-index: 10;
            max-width: 480px;
            margin: 0 auto;
        }
        .top-bar h1 { font-size: 18px; color: #D85A30; font-weight: 600; }
        .top-bar .back { color: #666; font-size: 20px; padding: 4px 8px; margin-left: -8px; }
        .top-bar .right { font-size: 14px; color: #D85A30; font-weight: 500; }
        
        /* 하단 네비게이션 */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            border-top: 1px solid #eee;
            display: flex;
            justify-content: space-around;
            padding: 8px 0;
            max-width: 480px;
            margin: 0 auto;
            z-index: 10;
        }
        .bottom-nav a {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            color: #999;
            font-size: 11px;
            padding: 4px 8px;
            min-width: 60px;
        }
        .bottom-nav a.active { color: #D85A30; font-weight: 500; }
        .bottom-nav .icon { font-size: 22px; line-height: 1; }
        
        /* 카드 */
        .card {
            background: white;
            padding: 16px;
            border-radius: 10px;
            margin-bottom: 10px;
        }
        
        /* 버튼 */
        .btn {
            display: inline-block;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: 500;
            text-align: center;
            cursor: pointer;
            border: none;
            font-size: 15px;
            font-family: inherit;
        }
        .btn-primary { background: #D85A30; color: white; }
        .btn-primary:hover { background: #C04E28; }
        .btn-outline { background: white; color: #D85A30; border: 1px solid #D85A30; }
        .btn-block { width: 100%; display: block; }
        .btn-sm { padding: 8px 14px; font-size: 13px; }
        .btn-success { background: #2E7D32; color: white; }
        .btn-danger { background: #C62828; color: white; }
        
        /* 폼 */
        .form-group { margin-bottom: 16px; }
        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: 500;
            color: #333;
        }
        .form-control {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            font-family: inherit;
        }
        .form-control:focus { outline: none; border-color: #D85A30; }
        textarea.form-control { resize: vertical; }
        .errors { color: #d32f2f; font-size: 13px; margin-top: 4px; }
        
        /* 메시지 알림 */
        .messages { margin-bottom: 12px; }
        .messages .msg {
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 8px;
        }
        .messages .success { background: #E1F5EE; color: #0F6E56; }
        .messages .error { background: #FCEBEB; color: #A32D2D; }
        .messages .info { background: #E3F2FD; color: #0D47A1; }
        
        /* 상태 배지 */
        .badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 500;
        }
        .badge-open { background: #E1F5EE; color: #2E7D32; }
        .badge-matched { background: #FFF3E0; color: #E65100; }
        .badge-closed { background: #ECEFF1; color: #546E7A; }
        .badge-cancelled { background: #ECEFF1; color: #546E7A; }
        .badge-pending { background: #E3F2FD; color: #0D47A1; }
        .badge-accepted { background: #E1F5EE; color: #2E7D32; }
        .badge-rejected { background: #FFEBEE; color: #C62828; }
        
        /* 빈 상태 */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }
    </style>
</head>
<body>
    {% block content %}{% endblock %}
    
    {% if user.is_authenticated %}
    <nav class="bottom-nav">
        <a href="{% url 'jobs:list' %}" class="{% if request.resolver_match.url_name == 'list' %}active{% endif %}">
            <span class="icon">🏠</span>
            <span>홈</span>
        </a>
        <a href="{% url 'jobs:create' %}" class="{% if request.resolver_match.url_name == 'create' %}active{% endif %}">
            <span class="icon">➕</span>
            <span>글쓰기</span>
        </a>
        <a href="{% url 'jobs:my_posts' %}" class="{% if request.resolver_match.url_name == 'my_posts' %}active{% endif %}">
            <span class="icon">📋</span>
            <span>내 구인</span>
        </a>
        <a href="{% url 'jobs:my_applications' %}" class="{% if request.resolver_match.url_name == 'my_applications' %}active{% endif %}">
            <span class="icon">📝</span>
            <span>내 지원</span>
        </a>
        <a href="{% url 'users:profile' %}" class="{% if request.resolver_match.url_name == 'profile' %}active{% endif %}">
            <span class="icon">👤</span>
            <span>프로필</span>
        </a>
    </nav>
    {% endif %}
</body>
</html>
