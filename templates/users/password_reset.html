<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비밀번호 찾기 - 알바핀치</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif; padding: 24px; max-width: 480px; margin: 0 auto; background: #f8f8f8; }
        .header { text-align: center; padding: 24px 0; }
        .header h1 { font-size: 22px; color: #D85A30; }
        .header p { color: #666; margin-top: 8px; font-size: 14px; }
        .card { background: white; padding: 24px; border-radius: 12px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 6px; font-size: 14px; font-weight: 500; color: #333; }
        .form-control { width: 100%; padding: 12px 14px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; font-family: inherit; }
        .form-control:focus { outline: none; border-color: #D85A30; }
        .btn { width: 100%; padding: 14px; background: #D85A30; color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: 500; cursor: pointer; margin-top: 8px; }
        .btn:hover { background: #C04E28; }
        .errors { color: #d32f2f; font-size: 13px; margin-top: 4px; }
        .info-box { background: #FFF8E1; border-left: 4px solid #FFA000; padding: 12px 14px; border-radius: 6px; margin-bottom: 16px; font-size: 13px; color: #B26A00; line-height: 1.5; }
        .link { text-align: center; margin-top: 20px; font-size: 14px; }
        .link a { color: #D85A30; text-decoration: none; font-weight: 500; }
        .back { display: inline-block; margin-bottom: 16px; color: #666; text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>
    <a href="{% url 'users:login' %}" class="back">← 로그인으로</a>
    
    <div class="header">
        <h1>🔑 비밀번호 찾기</h1>
        <p>가입 시 등록한 이메일로 비밀번호 재설정 링크를 보내드립니다</p>
    </div>
    
    <div class="card">
        <div class="info-box">
            <strong>⚠️ 안내</strong><br>
            발송용 이메일이 네이버 메일이라 <strong>네이버 메일</strong>로 등록한 사용자만 안정적으로 받을 수 있어요.
            다른 메일로 등록한 경우 스팸함을 꼭 확인해주세요.
        </div>

        <form method="post">
            {% csrf_token %}
            
            {% for field in form %}
                <div class="form-group">
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    {% if field.errors %}<div class="errors">{{ field.errors|striptags }}</div>{% endif %}
                </div>
            {% endfor %}
            
            <button type="submit" class="btn">재설정 링크 받기</button>
        </form>
        
        <p class="link">
            <a href="{% url 'users:login' %}">로그인으로 돌아가기</a>
        </p>
    </div>
</body>
</html>
