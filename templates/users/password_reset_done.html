<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이메일 발송 완료 - 알바핀치</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif; padding: 24px; max-width: 480px; margin: 0 auto; background: #f8f8f8; }
        .card { background: white; padding: 32px 24px; border-radius: 12px; text-align: center; margin-top: 48px; }
        .icon { font-size: 64px; margin-bottom: 16px; }
        h1 { font-size: 22px; color: #333; margin-bottom: 12px; }
        p { color: #666; line-height: 1.6; font-size: 14px; margin-bottom: 16px; }
        .info-box { background: #FFF8E1; border-left: 4px solid #FFA000; padding: 12px 14px; border-radius: 6px; margin: 20px 0; font-size: 13px; color: #B26A00; text-align: left; line-height: 1.6; }
        .btn { display: inline-block; padding: 12px 28px; background: #D85A30; color: #fff; text-decoration: none; border-radius: 8px; font-size: 15px; font-weight: 500; margin-top: 8px; }
        .btn:hover { background: #C04E28; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">📬</div>
        <h1>이메일을 확인해주세요</h1>
        <p>입력한 이메일이 등록되어 있다면<br>비밀번호 재설정 링크가 발송되었습니다.</p>
        
        <div class="info-box">
            <strong>📌 받지 못하셨다면?</strong><br>
            1. <strong>스팸함</strong>을 확인해주세요<br>
            2. 이메일을 정확히 입력했는지 확인<br>
            3. 5분 이내에 다시 시도<br>
            4. 그래도 안 되면 가입할 때 이메일을 등록 안 했을 가능성
        </div>
        
        <p style="font-size: 12px; color: #999;">
            ⏰ 재설정 링크는 24시간 동안 유효합니다
        </p>
        
        <a href="{% url 'users:login' %}" class="btn">로그인으로</a>
    </div>
</body>
</html>
