<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>유효하지 않은 링크 - 알바핀치</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif; padding: 24px; max-width: 480px; margin: 0 auto; background: #f8f8f8; }
        .card { background: white; padding: 32px 24px; border-radius: 12px; text-align: center; margin-top: 48px; }
        .icon { font-size: 64px; margin-bottom: 16px; }
        h1 { font-size: 22px; color: #333; margin-bottom: 12px; }
        p { color: #666; line-height: 1.6; font-size: 14px; margin-bottom: 20px; }
        .info-box { background: #FCEBEB; border-left: 4px solid #d32f2f; padding: 12px 14px; border-radius: 6px; margin: 20px 0; font-size: 13px; color: #A32D2D; text-align: left; line-height: 1.6; }
        .btn { display: inline-block; padding: 12px 28px; background: #D85A30; color: #fff; text-decoration: none; border-radius: 8px; font-size: 15px; font-weight: 500; margin-top: 8px; }
        .btn:hover { background: #C04E28; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">⚠️</div>
        <h1>유효하지 않은 링크입니다</h1>
        
        <div class="info-box">
            <strong>가능한 원인:</strong><br>
            • 링크가 24시간을 초과해서 만료됨<br>
            • 이미 한 번 사용한 링크<br>
            • 이미 비밀번호를 다른 방법으로 변경함<br>
            • 링크가 잘못 복사됨
        </div>
        
        <p>다시 비밀번호 찾기를 시도해주세요.</p>
        
        <a href="{% url 'users:password_reset' %}" class="btn">비밀번호 찾기 다시</a>
    </div>
</body>
</html>
