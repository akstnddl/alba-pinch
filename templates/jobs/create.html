{% extends 'base.html' %}

{% block title %}구인글 작성 - 알바핀치{% endblock %}

{% block content %}
<div class="top-bar">
    <a href="{% url 'jobs:list' %}" class="back">←</a>
    <h1>구인글 작성</h1>
    <span style="width: 30px;"></span>
</div>

<div class="page">
    <form method="post">
        {% csrf_token %}
        
        {% for field in form %}
        <div class="form-group">
            <label for="{{ field.id_for_label }}">{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}<div class="errors">{{ field.errors|striptags }}</div>{% endif %}
        </div>
        {% endfor %}
        
        <button type="submit" class="btn btn-primary btn-block" style="margin-top: 8px;">등록하기</button>
    </form>
</div>
{% endblock %}
